name: CI

on:
  push:
    branches: [main, windows, linux]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: PeaCore (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,   os: macos-15 }
          - { name: Ubuntu,  os: ubuntu-24.04 }
          - { name: Windows, os: windows-2025 }
    steps:
      - uses: actions/checkout@v4
      - uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: '6.1'
      - run: swift --version
      - name: Install GTK 4 (Linux UI)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config
      - name: Build PeaCore
        run: swift build --target PeaCore
      - name: Test
        if: runner.os != 'Windows'
        run: swift test
      - name: Compile core tests (Windows: the UI targets need GTK for Windows, so tests aren't run here yet)
        if: runner.os == 'Windows'
        run: swift build --target PeaCoreTests

  macos-app:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: '6.1'
      - run: swift build -c release --product Pea

  windows-app:
    name: Windows app + portable zip
    needs: core
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: '6.1'
      - name: Build and package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "0.0.0-ci.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Pea-windows-x64
          path: dist/Pea-*-windows-x64.zip
          if-no-files-found: error
